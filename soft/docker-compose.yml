# Local development services for the AI SDR Assistant.
#
# Project-scoped names and a non-default host port (54329) so this stack never
# collides with another local PostgreSQL project.
#
# Usage:
#   cp .env.example .env        # once, then edit as needed
#   docker compose up -d
#   docker compose down         # stop
#   docker compose down -v      # stop + destroy the data volume

name: ai-sdr-assistant

services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-sdr-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_sdr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_sdr_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ai_sdr}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - ai_sdr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_sdr} -d ${POSTGRES_DB:-ai_sdr}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ai_sdr_postgres_data:
